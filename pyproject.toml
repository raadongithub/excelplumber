[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excelplumber"
version = "0.1.0"
description = "Edge-case-hardened CSV/Excel parser for RAG chunking and embeddings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Raad Shaukat" }]
keywords = ["excel", "csv", "xlsx", "rag", "chunking", "embeddings", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
dependencies = [
    "openpyxl>=3.1",
    "charset-normalizer>=3.0",
    "python-dateutil>=2.8",
]

[project.urls]
Homepage = "https://github.com/raadongithub/excelplumber"
Repository = "https://github.com/raadongithub/excelplumber"
Issues = "https://github.com/raadongithub/excelplumber/issues"
Changelog = "https://github.com/raadongithub/excelplumber/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
excelplumber = "excelplumber.cli:main"

[project.entry-points."excelplumber.readers"]

[tool.hatch.build.targets.wheel]
packages = ["src/excelplumber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
