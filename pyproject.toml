[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excelplumber"
version = "0.1.0"
description = "Edge-case-hardened CSV/Excel parser for RAG chunking and embeddings"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Raad Shaukat" }]
keywords = ["excel", "csv", "xlsx", "rag", "chunking", "embeddings", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openpyxl>=3.1",
    "charset-normalizer>=3.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
excelplumber = "excelplumber.cli:main"

[project.entry-points."excelplumber.readers"]

[tool.hatch.build.targets.wheel]
packages = ["src/excelplumber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
